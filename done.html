<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 完成页禁缓存 + 禁快照 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>打卡完成</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
body{background:#f0fdf4;color:#065f46;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:#fff;border:1px solid #d1fae5;border-radius:16px;padding:32px 22px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(5,150,105,.1);text-align:center;}
.icon{font-size:60px;margin-bottom:10px;line-height:1;}
.title{font-size:22px;font-weight:700;color:#065f46;margin-bottom:6px;}
.sub{font-size:13px;color:#6b7280;margin-bottom:18px;}
.divider{height:1px;background:#e5e7eb;margin:18px 0;}
.info-row{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #f3f4f6;font-size:14px;}
.info-row:last-child{border-bottom:none;}
.info-label{color:#6b7280;}
.info-value{color:#111827;font-weight:500;max-width:60%;text-align:right;word-break:break-all;}
.tip{margin-top:16px;padding:10px;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;font-size:12px;color:#92400e;line-height:1.5;}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;}
.icon-err{color:#dc2626;}
.title-err{color:#b91c1c;}
</style>
</head>
<body>
<div class="card" id="card">
    <div id="content"><div class="loading">加载中...</div></div>
</div>

<script>
// =====================【部署配置】=====================
// 前后端部署在同一 Cloudflare Pages 域名下，使用相对路径即可
const API_BASE = "";
// =======================================================

// 从 URL 读取打卡结果
const urlObj = new URL(window.location.href);
const r = urlObj.searchParams.get("r");

// 锁住返回键:打卡完成后不允许返回到填表页
history.pushState(null, document.title, location.href);
window.addEventListener('popstate', function () {
    history.pushState(null, document.title, location.href);
    alert("打卡已完成，如需再次打卡请重新触碰 NFC 标签");
});

const content = document.getElementById("content");

if (!r) {
    // 没有打卡记录 → 直接访问 done.html，展示"无效访问"
    renderInvalid("本页面仅用于打卡成功后展示，请通过 NFC 标签打卡进入。");
} else {
    try {
        const record = JSON.parse(decodeURIComponent(r));
        renderSuccess(record);
    } catch (e) {
        renderInvalid("打卡记录解析失败，请重新打卡。");
    }
}

function renderSuccess(rec) {
    content.innerHTML = "";
    const icon = document.createElement("div");
    icon.className = "icon";
    icon.textContent = "✓";
    content.appendChild(icon);

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = "打卡成功";
    content.appendChild(title);

    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = "请截图保存作为凭证";
    content.appendChild(sub);

    const divider = document.createElement("div");
    divider.className = "divider";
    content.appendChild(divider);

    appendRow("姓名", rec.userName);
    appendRow("工号", rec.userCode);
    appendRow("科室", rec.dept);
    appendRow("打卡类型", rec.checkType);
    appendRow("打卡时间", formatTime(rec.checkTime));
    appendRow("与科室距离", rec.distance + " 米");
    if (rec.reason) appendRow("补卡原因", rec.reason);

    const tip = document.createElement("div");
    tip.className = "tip";
    tip.textContent = "本页面已禁用返回。如需再次打卡，请重新触碰 NFC 标签。本页面已禁止缓存，关闭后无法通过历史记录再次打开。";
    content.appendChild(tip);
}

function appendRow(label, value) {
    const row = document.createElement("div");
    row.className = "info-row";
    const l = document.createElement("span");
    l.className = "info-label";
    l.textContent = label;
    const v = document.createElement("span");
    v.className = "info-value";
    v.textContent = value;
    row.appendChild(l);
    row.appendChild(v);
    content.appendChild(row);
}

function renderInvalid(msg) {
    content.innerHTML = "";
    const card = document.getElementById("card");
    card.classList.add("err");
    const icon = document.createElement("div");
    icon.className = "icon icon-err";
    icon.textContent = "⛔";
    content.appendChild(icon);
    const title = document.createElement("div");
    title.className = "title title-err";
    title.textContent = "无效访问";
    content.appendChild(title);
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = msg;
    content.appendChild(sub);
}

function formatTime(ts) {
    const d = new Date(ts + 8 * 3600 * 1000);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
}

// 阻止返回到打卡页
window.history.pushState(null, "", window.location.href);
window.addEventListener("popstate", function () {
    window.history.pushState(null, "", window.location.href);
    alert("本页面不可返回，请重新触碰 NFC 标签打卡。");
});
</script>
</body>
</html>
